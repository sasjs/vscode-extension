# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs VS Code Extension Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts/jod]

    steps:
      - uses: actions/checkout@v4
        with:
          # The gitleaks step scans history, so the runner needs the whole
          # thing - the default depth-1 tree would scan only the head commit.
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check npm audit
        run: npm audit --audit-level=low --omit=dev

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Install the release toolchain
        # Validates the locked release tree against its manifest on every PR.
        # `node release/audit.mjs` reads the lockfile only (--package-lock-only),
        # so it cannot see drift between release/package.json and
        # release/package-lock.json; `npm ci` fails on that drift, which would
        # otherwise surface only at publish time on main. sasjs/adapter runs the
        # same step in its PR workflow (build-unit-tests.yml).
        run: npm ci --prefix release --ignore-scripts

      - name: Scan for secrets (gitleaks)
        # CI is the enforcement point: the local pre-commit hook is wired by
        # `npm run setup`, which a fresh clone has not run, and .npmrc's
        # ignore-scripts=true suppresses lifecycle scripts anyway. The binary
        # is the @nogoo9/gitleaks devDependency just installed by npm ci.
        run: node_modules/.bin/gitleaks detect --source . --redact --no-banner -v

      - name: Setup snippets and git hooks
        run: npm run setup

      - name: Check Code Style
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Package
        run: npm run vscode:prepublish
        env:
          CI: true
