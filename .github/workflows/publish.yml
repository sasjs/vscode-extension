# Publishes the extension in four jobs, each holding only the permission it
# needs. The split is a trust-boundary decision, not tidying:
#
#   1. release  contents: write                     tag the commit, open the draft
#                                                   release, decide whether to publish
#   2. build    contents: read                      build and package the VSIX,
#                                                   upload it as an artifact
#   3. sign     id-token + attestations: write      bind that artifact to this run,
#                                                   attest the exact bytes
#   4. publish  contents: write + marketplace token verify the bundle, publish to
#                                                   Open VSX, attach assets, release
#
# No job holds both an OIDC identity and a publish credential. The job that runs
# third-party build tooling (npm, vsce, ovsx) has no identity to mint provenance
# with, and the job that can mint provenance runs none of that tooling and holds
# no secret. A compromised dependency can therefore neither mint an attestation
# nor reach the marketplace token; it can only influence the bytes its own job
# produces, which is what the attestation then covers. The packaged tree includes
# snippets fetched from the network, so the attestation names the workflow, the
# commit and the bytes - not a reproducible build.
#
# package.json carries 0.0.0 in git: that is a placeholder, not a version. The
# release tag is the source of truth for the version, and --prepare-publish is
# what writes it into package.json for the packaging to read. So a checkout
# cannot claim a version, and a released .vsix cannot claim a different one
# from its tag.

name: SASjs VS Code Extension Deploy

on:
  push:
    branches:
      - main

# Serializes only cooperating runs in this repository; outside writers can race.
concurrency:
  group: vscode-extension-release
  cancel-in-progress: false
  queue: max

# read-only by default; each job grants the writes it needs
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    # Tag and draft release only. No OIDC identity, no marketplace token: the
    # release tool and the npm tree it runs in cannot sign anything.
    permissions:
      contents: write # the tag and the draft release
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the tool reads commits and tags to decide the version
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/krypton
      - run: npm ci

      - name: Check the release tool has no dependencies of its own
        # It runs with `contents: write`, so its tree has to be auditable, and the
        # property that makes it so is that it ships nothing of its own. Asserted
        # rather than audited, because the PR workflow's `npm audit --omit=dev`
        # cannot see a devDependency at all.
        run: |
          node -e '
          const p = require("./node_modules/@sasjs/release/package.json");
          const deps = Object.keys({
            ...p.dependencies,
            ...p.peerDependencies,
            ...p.optionalDependencies,
            ...(Array.isArray(p.bundledDependencies) ? Object.fromEntries(p.bundledDependencies.map((n) => [n, 1])) : p.bundledDependencies),
            ...(Array.isArray(p.bundleDependencies) ? Object.fromEntries(p.bundleDependencies.map((n) => [n, 1])) : p.bundleDependencies)
          });
          if (deps.length) {
            console.error("@sasjs/release " + p.version + " ships dependencies: " + deps.join(", "));
            process.exit(1);
          }
          console.log("@sasjs/release " + p.version + " ships no dependencies");
          '

      - name: Tag and release, if there is anything to release
        id: release
        # The tag and the release are created over the API: nothing is pushed to
        # main and no branch protection needs bypassing. `released` is false when
        # the commits since the last tag are docs/build/chore only.
        env:
          GH_TOKEN: ${{ github.token }}
        # --branch is deliberately absent: the flag is read by --prepare-publish
        # only, so passing it here would look like a guard while nothing checked
        # it. The tag this creates is checked against main by the next step.
        run: npm run release -- --host github --release --draft --output "$GITHUB_OUTPUT"

      - name: Work out whether this run still has something to publish
        id: gate
        # The release CLI can report released=true for a tag already published,
        # so both new releases and retries must consult the forge. A new draft may
        # take time to appear; retry the list before relying on the CLI's result.
        # API errors or malformed/ambiguous answers are never a successful no-op.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            # Only recover a version tag on this exact event commit, never a
            # reachable ancestor. Ambiguous candidates need human intervention.
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
              echo '::error::checkout differs from the push SHA'; exit 1;
            }
            CANDIDATES=()
            TAGS="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*')"
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
                CANDIDATES+=("$candidate")
              fi
            done <<< "$TAGS"
            if [ "${#CANDIDATES[@]}" -eq 0 ]; then
              # Draft releases do not necessarily have a remote or local tag.
              # Find a unique draft whose immutable target is the event SHA,
              # then create only a local marker for prepare/identity verification.
              TAG="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | node -e '
                let data = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", chunk => data += chunk);
                process.stdin.on("end", () => {
                  try {
                    const pages = JSON.parse(data);
                    if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page) || page.some(r => !r || typeof r !== "object" || Array.isArray(r) || typeof r.tag_name !== "string" || typeof r.draft !== "boolean" || (r.draft && typeof r.target_commitish !== "string")))) throw Error("invalid releases response");
                    const versionDrafts = pages.flat().filter(r => r.draft === true && /^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(r.tag_name));
                    const candidates = versionDrafts.filter(r => r.target_commitish === process.env.GITHUB_SHA);
                    if (candidates.length > 1) throw Error("multiple drafts target the push SHA");
                    if (candidates.length) process.stdout.write(candidates[0].tag_name);
                    else if (versionDrafts.length) console.error(`::warning::no draft targets the push SHA; version drafts not resumed: ${versionDrafts.map(r => `${r.tag_name} -> ${r.target_commitish}`).join(", ")}`);
                  } catch (e) { console.error(`::error::${e.message}`); process.exitCode = 1; }
                });
              ')"
              if [ -z "$TAG" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if git rev-parse --verify -q "refs/tags/$TAG" >/dev/null; then
                echo "::error::$TAG exists locally but does not name the push SHA"; exit 1
              fi
              git tag "$TAG" "$GITHUB_SHA"
            elif [ "${#CANDIDATES[@]}" -ne 1 ]; then
              echo '::error::multiple release tags point at the push SHA'; exit 1
            else
              TAG="${CANDIDATES[0]}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The paginated list includes drafts; the tag endpoint does not. Parse
          # the whole response so malformed or duplicate matches cannot look like
          # a missing release, and preserve false as distinct from missing.
          DRAFT=""
          for attempt in 1 2 3 4 5; do
            DRAFT="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | TAG="$TAG" node -e '
              let data = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const pages = JSON.parse(data);
                  if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page) || page.some(r => !r || typeof r !== "object" || Array.isArray(r) || typeof r.tag_name !== "string" || typeof r.draft !== "boolean"))) throw Error("invalid releases response");
                  const matches = pages.flat().filter(r => r.tag_name === process.env.TAG);
                  if (matches.length > 1) throw Error("multiple releases have the same tag");
                  if (matches.length) process.stdout.write(String(matches[0].draft));
                } catch (e) { console.error(`::error::${e.message}`); process.exitCode = 1; }
              });
            ')"
            [ -n "$DRAFT" ] && break
            echo "no release for $TAG yet (attempt $attempt): waiting for the forge"
            sleep 3
          done
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          case "$DRAFT" in
            true)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "$TAG has a draft release: packaging and publishing it"
              ;;
            false)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$TAG is already released: nothing to publish"
              ;;
            "")
              if [ "$RELEASED" = "true" ]; then
                echo "::error::Release for $TAG is not yet visible; retry the workflow"
                exit 1
              fi
              echo "::error::Release for $TAG is missing; resolve manually"
              exit 1
              ;;
            *)
              echo "::error::unexpected answer for $TAG: '$DRAFT'"
              exit 1
              ;;
          esac

      - name: Verify release identity
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: node .github/scripts/verify-release-identity.mjs "$TAG" "$EVENT_SHA"

  build:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Read-only, and no secrets. This job runs npm, npx, vsce and the snippet
    # fetchers, so it is the job most exposed to a compromised dependency: it is
    # given nothing that could sign an attestation or publish to the marketplace.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      vsix: ${{ steps.package.outputs.vsix }}
      digest: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the version tag has to be in the clone
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/krypton
      - name: Mark the release tag locally
        # A draft release creates no tag ref, and this job is a fresh checkout, so
        # the tag the release job resolved does not exist here. --prepare-publish
        # refuses a tag it cannot resolve, so recreate the marker at the push SHA -
        # never moving an existing one - and let the identity checks judge it.
        env:
          TAG: ${{ needs.release.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EVENT_SHA" ] || { echo '::error::checkout differs from the push SHA'; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EVENT_SHA" ] || { echo "::error::$TAG names another commit"; exit 1; }
          else
            git tag "$TAG" "$EVENT_SHA"
          fi
      - run: npm ci
      - run: npm audit signatures

      - name: Setup snippets and git hooks
        run: npm run setup

      - name: Check the snippet contributions point at files that exist
        # The snippets are fetched from an unpinned upstream directory, so the
        # contribution list and the fetched tree have to be compared where the
        # fetch happened. This is the step that would have caught 3.3.0 shipping a
        # manifest entry for a file upstream had deleted in January 2024.
        run: |
          node --test .github/scripts/check-snippets.test.mjs
          node .github/scripts/check-snippets.mjs

      - name: Build Project
        run: npm run vscode:prepublish

      - name: Decide what to package
        id: prepare
        # Reads the tag the release job resolved - a draft release has no tag of
        # its own until it is published - and stamps that version into
        # package.json. Refuses a tag that is not in this clone or not an
        # ancestor of main.
        #
        # --no-registry-lookup: this package ships to Open VSX and never to npm,
        # so asking npm whether the version exists answers nothing and reads as
        # though the version were new. Whether this run publishes is the release
        # job's question, which the forge answered.
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: npm run release -- --prepare-publish --branch main --no-registry-lookup --tag "$TAG" --output "$GITHUB_OUTPUT"

      - name: Package the extension
        id: package
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        # The marketplace tools are `npm run` targets in package.json, so the
        # version of vsce that lists the .vsix on a pull request and the version
        # that packages it here cannot drift apart - a packaging-rule change
        # between two versions is invisible to the check that exists to catch it.
        #
        # They are fetched by npx with an exact version rather than carried as
        # devDependencies, which is a stated trade-off: a lockfile entry would
        # also pin their integrity hashes, and these two trees bring ~130 packages
        # whose transitive versions do not exist in this lockfile at all. Adding
        # them re-resolved 83 unrelated packages when I measured it, so the cost
        # is an unrelated upgrade in the migration PR that deletes the second
        # locked tree - the opposite of what this change is for. The exposure is
        # narrow: a version cannot silently move, because the version is exact.
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo '::error::prepared version does not match the release tag; resolve manually'
            exit 1
          fi
          # vsce sorts entries and fixes every ZIP mtime when SOURCE_DATE_EPOCH is set.
          # ZIP metadata is stable for this commit, but other inputs can vary.
          # The marketplace hash gates attachment, not attestation creation.
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          VSIX="$(node -p 'require("./package.json").name')-${VERSION}.vsix"
          npm run vsix:package --silent -- --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Digest the packaged extension
        id: digest
        # The bytes that leave this job, named by digest. The sign job compares
        # this against the file it downloads and against the artifact API, so a
        # mismatch between what was packaged and what was attested is a failure
        # rather than a silent difference.
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: echo "sha256=$(sha256sum "$VSIX" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the extension as an artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Unarchived on purpose: with a single file the artifact digest is the
          # file's own SHA-256, so the artifact API record and the bytes the sign
          # job reads are the same thing.
          path: ${{ steps.package.outputs.vsix }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [release, build]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The only job with an OIDC identity and attestation write. It runs no npm,
    # npx or marketplace tooling, and holds no secret: the token here is the
    # read-only one, used to read the artifact's own record and to record the
    # attestation.
    permissions:
      contents: read
      actions: read          # read the artifact's own record from the API
      id-token: write        # OIDC identity for build provenance
      attestations: write    # record the attestation (which also allows reading it back)
    outputs:
      bundle-artifact-id: ${{ steps.bundle.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the VSIX artifact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # By id, not by name: an artifact name is chosen by whatever uploaded
          # it, so a name is not an identity.
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Bind the artifact to this run
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          METADATA: dist/artifact-metadata.json
        # Fails closed unless the artifact API says this id belongs to this run at
        # this SHA with this digest, and the downloaded file hashes to that digest.
        # On a re-run it also refuses to sign and says so through `mode`.
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$METADATA"
          node .github/scripts/vsix-bind.mjs "$METADATA" "$VSIX"

      - name: Attest the VSIX
        id: attest
        if: steps.bind.outputs.mode == 'sign'
        uses: sasjs/release/.github/actions/attest-assets@6bce05cbcd9364c7097f089ea6c9132978a500ca # v0.19.0
        with:
          version: ${{ needs.build.outputs.version }}
          subject-path: dist/${{ needs.build.outputs.vsix }}
          output-dir: dist

      - name: Reuse the attestation already recorded for these bytes
        if: steps.bind.outputs.mode == 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          VERSION: ${{ needs.build.outputs.version }}
          ATTESTATIONS: dist/attestations.json
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        # A re-run cannot sign (see vsix-bind.mjs), so it finishes the release
        # only if an attestation for exactly these bytes already exists. `gh`
        # verifies every bundle it returns against the identity policy below;
        # the selector then refuses to choose between distinct bundles.
        run: |
          gh attestation verify "$VSIX" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$ATTESTATIONS"
          node .github/scripts/select-attestation-bundle.mjs "$ATTESTATIONS" "$BUNDLE"

      - name: Verify the bundle against the exact VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        # Both paths - freshly signed and reused - are checked the same way, so a
        # bundle that does not cryptographically cover this VSIX stops here rather
        # than reaching the marketplace.
        run: |
          test -s "$BUNDLE" || { echo '::error::no provenance bundle to verify; resolve manually'; exit 1; }
          gh attestation verify "$VSIX" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Upload the provenance bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release, build, sign]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The marketplace token and the release writes live here, and the identity
    # does not: this job cannot mint provenance for anything it might publish.
    permissions:
      contents: write        # release assets, then the published release
                             # no identity, and no attestation permission: both
                             # verifications in this job read the uploaded bundle,
                             # so nothing here calls the attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/krypton

      - name: Download the extension and its bundle
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Both by id, and both unarchived, so the file on disk is the bytes the
          # sign job attested. download-artifact checks each download against the
          # digest the artifact API reports, and the bundle is verified against
          # this file before it is used.
          artifact-ids: ${{ needs.build.outputs.artifact-id }},${{ needs.sign.outputs.bundle-artifact-id }}
          path: dist
          merge-multiple: true

      - name: Verify build provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        # Runs before the irreversible marketplace publish, not only after: Open
        # VSX has no delete, so a provenance failure discovered afterwards burns
        # the version. The bundle is verified against the exact file here, not
        # assumed to have survived the hand-off unmodified.
        run: |
          test -s "$BUNDLE" || { echo '::error::no provenance bundle was uploaded; resolve manually'; exit 1; }
          gh attestation verify "$VSIX" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Fetch the marketplace tooling
        # Fetched here, where no marketplace token is in scope. npx caches per
        # job, so the step that holds OVSX_PAT resolves from the cache instead of
        # downloading - which is what keeps the download itself outside the
        # credentialed step. The flag goes on the CLI, not after the subcommand:
        # `ovsx publish --version` happens to print the version in 1.4.0, but that
        # is the subcommand's argument parser deciding, and it would be a
        # packaging failure if it ever stopped.
        run: npm run vsix:tooling --silent

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
        run: |
          # Open VSX is how users receive the extension, so a release that cannot
          # reach it has not shipped. Says so rather than skipping quietly: the
          # fix is the secret, and re-running afterwards is cheap.
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_TOKEN is empty, so $VSIX would never reach users"
            exit 1
          fi
          # No -p: ovsx reads OVSX_PAT from the environment (lib/util.js:
          # `options.pat ??= process.env.OVSX_PAT`), and passing the flag would put
          # the token in this process's argv, where any child process and a `ps` on
          # the runner can read it.
          #
          # --skip-duplicate can retain older bytes. The next step compares the
          # marketplace digest before any release assets can be attached.
          node .github/scripts/verify-release-identity.mjs "$TAG" "$EVENT_SHA"
          npm run vsix:publish --silent -- "$VSIX" --skip-duplicate

      - name: Verify the Open VSX artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          VERSION: ${{ needs.build.outputs.version }}
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        # This trusts Open VSX's checksum endpoint, not a fresh VSIX download.
        # A mismatch, unavailable checksum or invalid bundle requires manual recovery.
        run: bash .github/scripts/verify-open-vsx.sh "$VSIX" sasjs sasjs-for-vscode "$VERSION" "$BUNDLE"

      - name: Attach the .vsix and provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        # Conflicting assets require manual resolution; never delete them.
        run: node .github/scripts/release-assets.mjs attach "$TAG" "$EVENT_SHA" "$VSIX" "$BUNDLE"

      - name: Publish the release
        # Last: the release is created as a draft, so a version is never advertised
        # before its .vsix exists on the page. Running on the gate rather than on
        # `released` is what lets a re-run of the FAILED JOBS finish a release;
        # re-running all jobs rebuilds the VSIX, and those new bytes have no
        # attestation, so the sign job refuses (see vsix-bind.mjs).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          EVENT_SHA: ${{ github.sha }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
          BUNDLE: dist/provenance-${{ needs.build.outputs.version }}.intoto.jsonl
        run: |
          node .github/scripts/verify-release-identity.mjs "$TAG" "$EVENT_SHA"
          node .github/scripts/release-assets.mjs publish "$TAG" "$EVENT_SHA" "$VSIX" "$BUNDLE"
