# Publishes the extension. The tool cuts the tag and the release from the commits,
# this job packages the .vsix, ships it to Open VSX, and attaches it to the release.
#
# Order matters: the release step names the version, `--prepare-publish` stamps it
# into package.json, and everything after that reads the stamped file - so the
# .vsix users install, the .vsix on the release page and the tag all agree.

name: SASjs VS Code Extension Deploy

on:
  push:
    branches:
      - main

# read-only by default; the release job asks for the one write it needs
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag, the release, and the .vsix attached to it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the tool reads commits and tags to decide the version
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci

      - name: Setup snippets and git hooks
        run: npm run setup

      - name: Build Project
        run: npm run vscode:prepublish

      - run: npm audit signatures

      - name: Check the release tool has no dependencies of its own
        # It runs with `contents: write`, so its tree has to be auditable, and the
        # property that makes it so is that it ships nothing of its own. Asserted
        # rather than audited, because the PR workflow's `npm audit --omit=dev`
        # cannot see a devDependency at all.
        run: |
          node -e '
          const p = require("./node_modules/@sasjs/release/package.json");
          const deps = Object.keys({...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies});
          if (deps.length) {
            console.error("@sasjs/release " + p.version + " ships dependencies: " + deps.join(", "));
            process.exit(1);
          }
          console.log("@sasjs/release " + p.version + " ships no dependencies");
          '

      - name: Tag and release, if there is anything to release
        id: release
        # The tag and the release are created over the API: nothing is pushed to
        # main and no branch protection needs bypassing. `released` is false when
        # the commits since the last tag are docs/build/chore only.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release -- --host github --release --draft --branch main --output "$GITHUB_OUTPUT"

      - name: Decide what to package
        id: prepare
        # Reads the tag the step above reported - a draft has no tag of its own
        # yet - and stamps that version into package.json. Refuses a tag that is
        # not in this clone or not an ancestor of main.
        #
        # --no-registry-lookup: this package ships to Open VSX and never to npm,
        # so asking npm whether the version exists answers nothing and reads as
        # though the version were new. The publish decision is the tag being new.
        run: npm run release -- --prepare-publish --branch main --no-registry-lookup --tag "${{ steps.release.outputs.tag }}" --output "$GITHUB_OUTPUT"

      - name: Package the extension
        id: package
        if: steps.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          VSIX="$(node -p 'require("./package.json").name')-${VERSION}.vsix"
          # --yes with an exact version: this job holds contents: write, so the
          # packaging tool is pinned by version rather than resolved fresh.
          npx --yes @vscode/vsce@4.1.1 package --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        if: steps.prepare.outputs.publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          # Open VSX is how users receive the extension, so a release that cannot
          # reach it has not shipped. Says so rather than skipping quietly: the
          # fix is the secret, and re-running afterwards is cheap.
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_TOKEN is empty, so ${{ steps.package.outputs.vsix }} would never reach users"
            exit 1
          fi
          # --skip-duplicate is what makes a re-run safe: the second run meets a
          # version it already published, which is the state it wants.
          npx --yes ovsx@1.4.0 publish "${{ steps.package.outputs.vsix }}" -p "$OVSX_PAT" --skip-duplicate

      - name: Attach the .vsix to the release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.vsix }}" --clobber

      - name: Publish the release
        # Last: the release is created as a draft, so a version is never
        # advertised before its .vsix exists on the page. This is also what makes
        # the tag visible to everything that is not the API.
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
