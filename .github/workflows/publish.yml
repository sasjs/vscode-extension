# Publishes the extension, in five steps:
#
#   npm run release -- --host github --release --draft      tag + draft release
#   npm run release -- --prepare-publish --no-registry-lookup   stamp the version
#   npm run vsix:package                                     build the .vsix
#   npm run vsix:publish                                     ship it to Open VSX
#   gh release upload / gh release edit --draft=false        attach, then publish
#
# package.json carries 0.0.0 in git: that is a placeholder, not a version. The
# release tag is the source of truth for the version, and the second step is what
# writes it into package.json for the packaging to read. So a checkout cannot claim
# a version, and a released .vsix cannot claim a different one from its tag.

name: SASjs VS Code Extension Deploy

on:
  push:
    branches:
      - main

# read-only by default; the release job asks for the one write it needs
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag, the release, and the .vsix attached to it

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0      # the tool reads commits and tags to decide the version
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci

      - name: Setup snippets and git hooks
        run: npm run setup

      - name: Build Project
        run: npm run vscode:prepublish

      - run: npm audit signatures

      - name: Check the release tool has no dependencies of its own
        # It runs with `contents: write`, so its tree has to be auditable, and the
        # property that makes it so is that it ships nothing of its own. Asserted
        # rather than audited, because the PR workflow's `npm audit --omit=dev`
        # cannot see a devDependency at all.
        run: |
          node -e '
          const p = require("./node_modules/@sasjs/release/package.json");
          const deps = Object.keys({
            ...p.dependencies,
            ...p.peerDependencies,
            ...p.optionalDependencies,
            ...(Array.isArray(p.bundledDependencies) ? Object.fromEntries(p.bundledDependencies.map((n) => [n, 1])) : p.bundledDependencies),
            ...(Array.isArray(p.bundleDependencies) ? Object.fromEntries(p.bundleDependencies.map((n) => [n, 1])) : p.bundleDependencies)
          });
          if (deps.length) {
            console.error("@sasjs/release " + p.version + " ships dependencies: " + deps.join(", "));
            process.exit(1);
          }
          console.log("@sasjs/release " + p.version + " ships no dependencies");
          '

      - name: Tag and release, if there is anything to release
        id: release
        # The tag and the release are created over the API: nothing is pushed to
        # main and no branch protection needs bypassing. `released` is false when
        # the commits since the last tag are docs/build/chore only.
        env:
          GH_TOKEN: ${{ github.token }}
        # --branch is deliberately absent: the flag is read by --prepare-publish
        # only, so passing it here would look like a guard while nothing checked
        # it. The tag this creates is checked against main by the next step.
        run: npm run release -- --host github --release --draft --output "$GITHUB_OUTPUT"

      - name: Work out whether this run still has something to publish
        id: gate
        # A re-run must be able to finish a job that failed half way, and a
        # docs-only merge must not rebuild the version before it. `released` alone
        # cannot tell those apart: on a re-run the tag already exists, so the step
        # above reports released=false and everything below would be skipped -
        # leaving a draft release and no .vsix.
        #
        # The forge can answer it directly: a release still in draft means work is
        # outstanding for that tag, a published one means the version is done.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(git describe --tags --abbrev=0)"; fi
          # `gh release view <tag>` asks /releases/tags/<tag>, which does not return
          # drafts - the very release this step needs to find. Listed and matched
          # instead, for the same reason.
          DRAFT="$(gh release list --limit 100 --json tagName,isDraft \
            -q "[.[] | select(.tagName == \"$TAG\")] | (.[0].isDraft // \"missing\")")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has a draft release: packaging and publishing it"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released (draft=$DRAFT): nothing to publish"
          fi

      - name: Decide what to package
        id: prepare
        if: steps.gate.outputs.publish == 'true'
        # Reads the tag the gate resolved - a draft release has no tag of its own
        # until it is published - and stamps that version into package.json.
        # Refuses a tag that is not in this clone or not an ancestor of main.
        #
        # --no-registry-lookup: this package ships to Open VSX and never to npm, so
        # asking npm whether the version exists answers nothing and reads as though
        # the version were new. Whether this run publishes is the gate's question,
        # which the forge answers; this step only prepares the tree.
        run: npm run release -- --prepare-publish --branch main --no-registry-lookup --tag "${{ steps.gate.outputs.tag }}" --output "$GITHUB_OUTPUT"

      - name: Package the extension
        id: package
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        # The marketplace tools are `npm run` targets in package.json, so the
        # version of vsce that lists the .vsix on a pull request and the version
        # that packages it here cannot drift apart - a packaging-rule change
        # between two versions is invisible to the check that exists to catch it.
        #
        # They are fetched by npx with an exact version rather than carried as
        # devDependencies, which is a stated trade-off: a lockfile entry would
        # also pin their integrity hashes, and these two trees bring ~130 packages
        # whose transitive versions do not exist in this lockfile at all. Adding
        # them re-resolved 83 unrelated packages when I measured it, so the cost
        # is an unrelated upgrade in the migration PR that deletes the second
        # locked tree - the opposite of what this change is for. The exposure is
        # narrow: a version cannot silently move, because the version is exact.
        run: |
          VSIX="$(node -p 'require("./package.json").name')-${VERSION}.vsix"
          npm run vsix:package --silent -- --out "$VSIX"
          # Fetch the publisher here, where no token is in scope. npx caches per
          # job, so the step that holds OVSX_PAT resolves from the cache instead of
          # downloading: an exact version pins which package, and this is what keeps
          # the download itself outside the credentialed step.
          npm run vsix:publish --silent -- --version
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        if: steps.gate.outputs.publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          # Open VSX is how users receive the extension, so a release that cannot
          # reach it has not shipped. Says so rather than skipping quietly: the
          # fix is the secret, and re-running afterwards is cheap.
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_TOKEN is empty, so ${{ steps.package.outputs.vsix }} would never reach users"
            exit 1
          fi
          # --skip-duplicate is what makes a re-run safe: the second run meets a
          # version it already published, which is the state it wants.
          npm run vsix:publish --silent -- "${{ steps.package.outputs.vsix }}" -p "$OVSX_PAT" --skip-duplicate

      - name: Attach the .vsix to the release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "${{ steps.package.outputs.vsix }}" --clobber

      - name: Publish the release
        # Last: the release is created as a draft, so a version is never advertised
        # before its .vsix exists on the page. Running on the gate rather than on
        # `released` is what makes a re-run finish a failed job.
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
