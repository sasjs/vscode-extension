# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs VS Code Extension Deploy

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests



    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # semantic-release needs full history + tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Setup snippets and git hooks
        run: npm run setup

      - name: Build Project
        run: npm run vscode:prepublish

#  Unable to publish to VS Code marketplace due to azure issues
#      - name: Install VSCE
#        run: sudo npm install -g vsce


      - run: npm audit signatures

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install the release tooling
        # Its own locked tree, installed here rather than carried as a
        # devDependency: that tree is where the unfixable advisories live, so
        # keeping it out of the package's dependencies keeps it out of the
        # package's `npm audit`. Locked, so the resolved versions and their
        # integrity hashes are pinned rather than fetched fresh at release time.
        run: npm ci --prefix release --ignore-scripts

      - name: Semantic release
        run: release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In case you want to publish to Visual Studio Marketplace
          # VSCE_PAT: ${{ secrets.VSCE_PAT }}
          # In case you want to publish to Open VSX Registry
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}





